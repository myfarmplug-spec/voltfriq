<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your VoltFriq verification code</title>
</head>
<body style="margin:0;background:#07111d;color:#f8fbff;font-family:Inter,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#07111d;padding:28px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#0b1829;border:1px solid rgba(255,255,255,0.12);border-radius:18px;padding:28px;">
          <tr>
            <td>
              <h1 style="margin:0 0 12px;font-size:24px;line-height:1.2;color:#ffffff;">Confirm your VoltFriq signup</h1>
              <p style="margin:0 0 18px;color:#b9c3d3;font-size:15px;line-height:1.6;">Enter this 6-digit code in the VoltFriq app to verify your email.</p>
              <div style="font-size:34px;letter-spacing:8px;font-weight:800;color:#ffb800;background:#050b15;border-radius:14px;padding:18px 20px;text-align:center;">{{ .Token }}</div>
              <p style="margin:18px 0 0;color:#8f9bad;font-size:13px;line-height:1.6;">If the code screen is not open, use this fallback link:</p>
              <p style="margin:8px 0 0;font-size:14px;line-height:1.5;"><a href="{{ .ConfirmationURL }}" style="color:#ffcf4a;">Open VoltFriq verification</a></p>
              <p style="margin:24px 0 0;color:#6f7d91;font-size:12px;line-height:1.5;">You received this because this email was used to create a VoltFriq account.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
